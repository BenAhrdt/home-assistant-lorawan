blueprint:
  name: "LoRaWAN – Wöchentliche Vicki-Motorkalibrierung"
  description: >-
    Betätigt den MotorCalibration-Button ausgewählter Vicki-Thermostate jede
    Woche am gewählten lokalen Wochentag und zur gewählten Uhrzeit. Die
    Geräteauswahl ist auf die LoRaWAN-Integration und das Modell Vicki begrenzt.
    Zur Laufzeit wird zusätzlich geprüft, ob jedes ausgewählte Gerät genau ein
    aktives MotorCalibration-Control anbietet. Der Blueprint benötigt keinen
    Uplink-Zeittrigger. Die Vicki-Versandart bleibt maßgeblich; bei
    "enabled & collect" wird der Befehl vorgemerkt. Der separate Next-Send-
    Blueprint kann den gesammelten Downlink anschließend vor dem nächsten
    Uplink pushen.
  domain: automation
  source_url: https://github.com/BenAhrdt/home-assistant-lorawan/blob/main/blueprints/automation/lorawan/weekly_motor_calibration.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    calibration_devices:
      name: Vicki-Geräte
      description: >-
        Die Thermostate, deren Motor regelmäßig kalibriert werden soll. Zur
        Laufzeit wird zusätzlich geprüft, ob jedes Gerät ein aktives und
        eindeutiges MotorCalibration-Control anbietet.
      selector:
        device:
          multiple: true
          filter:
            - integration: lorawan
              model: Vicki
    calibration_weekday:
      name: Wochentag
      default: sun
      selector:
        select:
          options:
            - label: Montag
              value: mon
            - label: Dienstag
              value: tue
            - label: Mittwoch
              value: wed
            - label: Donnerstag
              value: thu
            - label: Freitag
              value: fri
            - label: Samstag
              value: sat
            - label: Sonntag
              value: sun
          mode: dropdown
    calibration_time:
      name: Uhrzeit
      description: Lokale Home-Assistant-Zeit, zu der die Kalibrierung ausgeführt wird.
      default: "10:00:00"
      selector:
        time: {}

mode: single
max_exceeded: warning

variables:
  calibration_devices: !input calibration_devices
  calibration_weekday: !input calibration_weekday

triggers:
  - trigger: time
    at: !input calibration_time

actions:
  - alias: Nur mit echtem Zeittrigger fortfahren
    if:
      - condition: template
        value_template: >-
          {{ trigger is not defined or trigger.platform != 'time' }}
    then:
      - stop: "Kein Zeittrigger vorhanden. Zum nächsten gewählten Zeitpunkt warten."
  - alias: Gewählten Wochentag prüfen
    if:
      - condition: template
        value_template: >-
          {% set weekdays = {
            'mon': 0, 'tue': 1, 'wed': 2, 'thu': 3,
            'fri': 4, 'sat': 5, 'sun': 6
          } %}
          {{ calibration_weekday not in weekdays
             or now().weekday() != weekdays[calibration_weekday] }}
    then:
      - stop: "Heute ist nicht der gewählte Wochentag."
  - variables:
      target_resolution: >-
        {% set ns = namespace(buttons=[], unresolved=[]) %}
        {% for selected_device in calibration_devices %}
          {% set candidates = namespace(entities=[]) %}
          {% for entity_id in device_entities(selected_device) %}
            {% if entity_id.startswith('button.')
                  and device_id(entity_id) == selected_device
                  and state_attr(entity_id, 'lorawan_control_key') == 'motor_calibration' %}
              {% set candidates.entities = candidates.entities + [entity_id] %}
            {% endif %}
          {% endfor %}
          {% if candidates.entities | count == 1 %}
            {% set ns.buttons = ns.buttons + candidates.entities %}
          {% else %}
            {% set ns.unresolved = ns.unresolved + [selected_device] %}
          {% endif %}
        {% endfor %}
        {{ {'buttons': ns.buttons, 'unresolved': ns.unresolved} }}
  - variables:
      target_buttons: "{{ target_resolution.get('buttons', []) }}"
      unresolved_devices: "{{ target_resolution.get('unresolved', []) }}"
  - alias: MotorCalibration-Controls prüfen
    if:
      - condition: template
        value_template: >-
          {{ unresolved_devices | count > 0
             or target_buttons | count != calibration_devices | count }}
    then:
      - stop: >-
          Mindestens ein ausgewähltes Vicki-Gerät stellt kein eindeutig
          auflösbares MotorCalibration-Control bereit.
  - alias: Motorkalibrierung zum gewählten Zeitpunkt betätigen
    action: button.press
    target:
      entity_id: "{{ target_buttons }}"
