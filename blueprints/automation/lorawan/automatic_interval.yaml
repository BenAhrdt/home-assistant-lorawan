blueprint:
  name: "LoRaWAN – Automatische Intervallsteuerung"
  description: >-
    Setzt den Intervall-Downlink ausgewählter LoRaWAN-Geräte nach einem
    wiederkehrenden Jahresplan. Der Blueprint arbeitet ausschließlich mit
    einem eigenen täglichen Zeittrigger und reagiert nicht auf
    lorawan_uplink_schedule oder andere Uplink-Ereignisse. Es können bis zu
    fünf Zeiträume mit jeweils bis zu fünf Geräte-/Intervall-Zuweisungen
    konfiguriert werden. Innerhalb eines Zeitraums dürfen Geräte nur einmal
    zugewiesen werden. Geräte ohne eindeutigen Intervall-Control oder mit
    einem außerhalb des individuellen Wertebereichs liegenden Wert werden
    sicher übersprungen. Bereits identische Werte werden nicht erneut als
    Downlink geschrieben.
  domain: automation
  source_url: https://github.com/BenAhrdt/home-assistant-lorawan/blob/main/blueprints/automation/lorawan/automatic_interval.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    evaluation_time:
      name: Tägliche Prüfzeit
      description: >-
        Lokale Home-Assistant-Zeit, zu der der aktuell gültige Zeitraum
        ausgewertet wird. Die Standardzeit liegt kurz nach Mitternacht.
      default: "00:05:00"
      selector:
        time: {}

    period_1_enabled:
      name: Zeitraum 1 aktiv
      default: false
      selector:
        boolean: {}
    period_1_start_month:
      name: Zeitraum 1 – Startmonat
      default: 1
      selector:
        number:
          min: 1
          max: 12
          step: 1
          mode: box
    period_1_start_day:
      name: Zeitraum 1 – Starttag
      default: 1
      selector:
        number:
          min: 1
          max: 31
          step: 1
          mode: box
    period_1_end_month:
      name: Zeitraum 1 – Endmonat
      default: 12
      selector:
        number:
          min: 1
          max: 12
          step: 1
          mode: box
    period_1_end_day:
      name: Zeitraum 1 – Endtag
      default: 31
      selector:
        number:
          min: 1
          max: 31
          step: 1
          mode: box
    period_1_assignment_1_devices:
      name: Zeitraum 1 – Zuweisung 1 – Geräte
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: lorawan
          entity:
            - integration: lorawan
              domain: number
    period_1_assignment_1_interval:
      name: Zeitraum 1 – Zuweisung 1 – Intervall (Minuten)
      default: 5
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    period_1_assignment_2_devices:
      name: Zeitraum 1 – Zuweisung 2 – Geräte
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: lorawan
          entity:
            - integration: lorawan
              domain: number
    period_1_assignment_2_interval:
      name: Zeitraum 1 – Zuweisung 2 – Intervall (Minuten)
      default: 5
