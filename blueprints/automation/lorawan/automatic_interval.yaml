blueprint:
  name: "LoRaWAN – Automatische Intervallsteuerung"
  description: >-
    Setzt den Intervall-Downlink ausgewählter LoRaWAN-Geräte anhand beliebig
    vieler wiederholbarer Zeitplanzeilen. Jede Zeitplanzeile enthält ein Datum,
    Monat und Tag, optional eine Uhrzeit und beliebig viele
    Geräte-/Intervall-Zuweisungen.
    Der Blueprint arbeitet ausschließlich zeitbasiert und reagiert nicht auf
    lorawan_uplink_schedule oder andere Uplink-Ereignisse. Monat und Tag
    wiederholen sich jährlich. Bereits identische
    Werte werden nicht erneut als Downlink geschrieben. Das Hamburger-Symbol
    im Editor sortiert Einträge; zum Bearbeiten bitte das Stift-Symbol verwenden.
  domain: automation
  source_url: https://github.com/BenAhrdt/home-assistant-lorawan/blob/main/blueprints/automation/lorawan/automatic_interval.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    schedule:
      name: AutoIntervall-Zeitplan
      description: >-
        Beliebig viele Zeitplanzeilen hinzufügen. Jede Zeile enthält Monat und
        Tag, optional eine Uhrzeit und wiederholbare
        Geräte-/Intervall-Zuweisungen.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          fields:
            name:
              label: Bezeichnung
              required: false
              selector:
                text: {}
            month:
              label: Zeitpunkt – Monat
              required: true
              selector:
                select:
                  options:
                    - label: Januar
                      value: "1"
                    - label: Februar
                      value: "2"
                    - label: März
                      value: "3"
                    - label: April
                      value: "4"
                    - label: Mai
                      value: "5"
                    - label: Juni
                      value: "6"
                    - label: Juli
                      value: "7"
                    - label: August
                      value: "8"
                    - label: September
                      value: "9"
                    - label: Oktober
                      value: "10"
                    - label: November
                      value: "11"
                    - label: Dezember
                      value: "12"
                  mode: dropdown
            day:
              label: Zeitpunkt – Tag
              required: true
              selector:
                number:
                  min: 1
                  max: 31
                  step: 1
                  mode: box
            time:
              label: Zeitpunkt – Uhrzeit (optional)
              required: false
              default: "00:05:00"
              selector:
                time: {}
            assignments:
              label: Geräte-/Intervall-Zuweisungen
              required: false
              default: []
              selector:
                object:
                  multiple: true
                  label_field: name
                  fields:
                    name:
                      label: Bezeichnung
                      required: false
                      selector:
                        text: {}
                    devices:
                      label: Gerät(e)
                      required: true
                      selector:
                        device:
                          multiple: true
                          filter:
                            - integration: lorawan
                          entity:
                            - integration: lorawan
                              domain: number
                    interval:
                      label: Intervallwert (Minuten)
                      required: true
                      selector:
                        number:
                          min: 1
                          max: 1440
                          step: 1
                          unit_of_measurement: min
                          mode: box

mode: single
max_exceeded: warning

variables:
  schedule: !input schedule

triggers:
  - trigger: time_pattern
    minutes: "/1"

actions:
  - variables:
      current_month: "{{ now().month }}"
      current_day: "{{ now().day }}"
      current_time: "{{ now().strftime('%H:%M') }}"
  - variables:
      active_schedule: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for entry in schedule -%}
          {%- set entry_time = (entry.get('time') or '00:05:00') | string -%}
          {%- if entry.get('month', 0) | int == current_month | int
                and entry.get('day', 0) | int == current_day | int
                and entry_time[:5] == current_time -%}
            {%- set ns.items = ns.items + [entry] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.items -}}
  - if:
      - condition: template
        value_template: "{{ active_schedule | count == 0 }}"
    then:
      - stop: "Für den aktuellen Zeitpunkt ist kein AutoIntervall-Eintrag fällig."
  - variables:
      active_assignments: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for entry in active_schedule -%}
          {%- for assignment in entry.get('assignments', []) -%}
            {%- set ns.items = ns.items + [assignment] -%}
          {%- endfor -%}
        {%- endfor -%}
        {{- ns.items -}}
  - variables:
      assigned_devices: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for assignment in active_assignments -%}
          {%- for selected_device in assignment.get('devices', []) -%}
            {%- set ns.items = ns.items + [selected_device] -%}
          {%- endfor -%}
        {%- endfor -%}
        {{- ns.items -}}
  - variables:
      duplicate_devices: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for selected_device in assigned_devices -%}
          {%- if assigned_devices.count(selected_device) > 1
                and selected_device not in ns.items -%}
            {%- set ns.items = ns.items + [selected_device] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.items -}}
  - if:
      - condition: template
        value_template: "{{ duplicate_devices | count > 0 }}"
    then:
      - stop: >-
          Ein Gerät ist für denselben Zeitpunkt mehrfach zugewiesen. Bitte
          jedes Gerät je Zeitpunkt nur einmal auswählen.
  - if:
      - condition: template
        value_template: "{{ assigned_devices | count == 0 }}"
    then:
      - stop: "Für den aktuellen Zeitpunkt sind keine Geräte zugewiesen."
  - repeat:
      for_each: "{{ active_assignments }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item.get('devices', []) | count > 0 }}"
          then:
            - variables:
                assignment_devices: "{{ repeat.item.get('devices', []) }}"
                assignment_interval: "{{ repeat.item.get('interval', 0) | int }}"
                assignment_name: >-
                  {{ repeat.item.get('name')
                     or (device_attr(repeat.item.get('devices', [])[0], 'name')
                         if repeat.item.get('devices', []) | count == 1 else '')
                     or 'Unbenannte Zuweisung' }}
            - variables:
                resolution: >-
                  {%- set ns = namespace(targets=[], skipped=[]) -%}
                  {%- for selected_device in assignment_devices -%}
                    {%- set candidates = namespace(entities=[]) -%}
                    {%- for entity_id in device_entities(selected_device) -%}
                      {%- if entity_id.startswith('number.')
                            and state_attr(entity_id, 'lorawan_control_key')
                              in ['intervall', 'interval']
                            and states(entity_id) != 'unavailable' -%}
                        {%- set candidates.entities = candidates.entities + [entity_id] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if candidates.entities | count == 1 -%}
                      {%- set entity_id = candidates.entities[0] -%}
                      {%- set minimum = state_attr(entity_id, 'min') | float(-999999) -%}
                      {%- set maximum = state_attr(entity_id, 'max') | float(999999) -%}
                      {%- if minimum <= assignment_interval <= maximum -%}
                        {%- if states(entity_id) | float(-999999) != assignment_interval -%}
                          {%- set ns.targets = ns.targets + [entity_id] -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set ns.skipped = ns.skipped + [selected_device] -%}
                      {%- endif -%}
                    {%- else -%}
                      {%- set ns.skipped = ns.skipped + [selected_device] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- {'targets': ns.targets, 'skipped': ns.skipped} -}}
            - if:
                - condition: template
                  value_template: "{{ resolution.get('targets', []) | count > 0 }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "{{ resolution.get('targets', []) }}"
                  data:
                    value: "{{ assignment_interval }}"
