triggers:
  - trigger: time
    at: !input evaluation_time

actions:
  - variables:
      current_day: "{{ now().month * 100 + now().day }}"
  - variables:
      active_periods: >-
        {%- set ns = namespace(matches=[]) -%}
        {%- for period in periods -%}
          {%- if period.get('enabled', false) -%}
            {%- set start = period.get('start_month', 1) | int * 100
               + period.get('start_day', 1) | int -%}
            {%- set end = period.get('end_month', 12) | int * 100
               + period.get('end_day', 31) | int -%}
            {%- set today = current_day | int -%}
            {%- set matches = (start <= today <= end)
               if start <= end else (today >= start or today <= end) -%}
            {%- if matches -%}
              {%- set ns.matches = ns.matches + [period] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.matches -}}
  - if:
      - condition: template
        value_template: "{{ active_periods | count > 1 }}"
    then:
      - stop: >-
          Mehrere AutoIntervall-Zeiträume sind am heutigen Datum aktiv. Bitte
          die Zeiträume so anpassen, dass sie sich nicht überschneiden.
  - if:
      - condition: template
        value_template: "{{ active_periods | count == 0 }}"
    then:
      - stop: "Für das heutige Datum ist kein AutoIntervall-Zeitraum aktiv."
  - variables:
      active_period: "{{ active_periods[0] }}"
      active_assignments: "{{ active_period.get('assignments', []) }}"
  - variables:
      assigned_devices: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for assignment in active_assignments -%}
          {%- for selected_device in assignment.get('devices', []) -%}
            {%- set ns.items = ns.items + [selected_device] -%}
          {%- endfor -%}
        {%- endfor -%}
        {{- ns.items -}}
  - variables:
      duplicate_devices: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for selected_device in assigned_devices -%}
          {%- if assigned_devices.count(selected_device) > 1
                and selected_device not in ns.items -%}
            {%- set ns.items = ns.items + [selected_device] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.items -}}
  - if:
      - condition: template
        value_template: "{{ duplicate_devices | count > 0 }}"
    then:
      - stop: >-
          Ein Gerät ist im aktiven Zeitraum mehreren Zuweisungen zugeordnet.
          Bitte jedes Gerät innerhalb eines Zeitraums nur einmal auswählen.
  - if:
      - condition: template
        value_template: "{{ assigned_devices | count == 0 }}"
    then:
      - stop: "Im aktiven Zeitraum sind keine Geräte zugewiesen."
  - repeat:
      for_each: "{{ active_assignments }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item.get('devices', []) | count > 0 }}"
          then:
            - variables:
                assignment_devices: "{{ repeat.item.get('devices', []) }}"
                assignment_interval: "{{ repeat.item.get('interval', 0) | int }}"
            - variables:
                resolution: >-
                  {%- set ns = namespace(targets=[], skipped=[]) -%}
                  {%- for selected_device in assignment_devices -%}
                    {%- set candidates = namespace(entities=[]) -%}
                    {%- for entity_id in device_entities(selected_device) -%}
                      {%- if entity_id.startswith('number.')
                            and state_attr(entity_id, 'lorawan_control_key')
                              in ['intervall', 'interval']
                            and states(entity_id) != 'unavailable' -%}
                        {%- set candidates.entities = candidates.entities + [entity_id] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if candidates.entities | count == 1 -%}
                      {%- set entity_id = candidates.entities[0] -%}
                      {%- set minimum = state_attr(entity_id, 'min') | float(-999999) -%}
                      {%- set maximum = state_attr(entity_id, 'max') | float(999999) -%}
                      {%- if minimum <= assignment_interval <= maximum -%}
                        {%- if states(entity_id) | float(-999999) != assignment_interval -%}
                          {%- set ns.targets = ns.targets + [entity_id] -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set ns.skipped = ns.skipped + [selected_device] -%}
                      {%- endif -%}
                    {%- else -%}
                      {%- set ns.skipped = ns.skipped + [selected_device] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- {'targets': ns.targets, 'skipped': ns.skipped} -}}
            - if:
                - condition: template
                  value_template: "{{ resolution.get('targets', []) | count > 0 }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "{{ resolution.get('targets', []) }}"
                  data:
                    value: "{{ assignment_interval }}"
